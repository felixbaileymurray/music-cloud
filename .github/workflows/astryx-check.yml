name: Astryx Checks

on:
  pull_request:
    branches: [dev]
    paths:
      - "src/**"
      - "AGENTS.md"
      - "eslint.config.mjs"
      - "eslint.astryx-interim.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/astryx-check.yml"
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "AGENTS.md"
      - "eslint.config.mjs"
      - "eslint.astryx-interim.mjs"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: astryx-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  astryx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astryx doctor and theme artifacts
        run: npm run astryx:check

      - name: Interim Astryx ESLint rules
        run: npm run lint:astryx-interim

      - name: Production build
        run: npm run build
