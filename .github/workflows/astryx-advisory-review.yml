name: Astryx advisory review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "AGENTS.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: astryx-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run advisory design-system review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASTRYX_REVIEW_MODEL: ${{ vars.ASTRYX_REVIEW_MODEL }}
        run: node scripts/astryx-advisory-review.mjs
