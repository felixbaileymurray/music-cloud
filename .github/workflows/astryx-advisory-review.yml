name: Design System Reviewer

# Listed on every reviewable pull request. The model runs only when UI files changed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      force:
        description: Re-run even if a review comment already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: astryx-advisory-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  advisory:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR SHAs (manual re-run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ github.event.inputs.pr_number }}"
          base=$(gh pr view "$pr" --json baseRefOid -q .baseRefOid)
          head=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"

      - name: UI files in this pull request
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_SHA }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- src/app src/components || true)
          if printf '%s\n' "$files" | grep -Eq '^src/(app|components)/.+\.(tsx|ts)$'; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "No UI files changed. Check passed without a model call."
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.review == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.review == 'true'
        run: npm ci

      - name: Run Design System Reviewer
        if: steps.scope.outputs.review == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || env.PR_NUMBER }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_SHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASTRYX_REVIEW_MODEL: ${{ vars.ASTRYX_REVIEW_MODEL }}
          FORCE_REVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == true && 'true' || '' }}
        run: node scripts/astryx-advisory/review.mjs
