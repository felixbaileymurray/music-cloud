name: Code review (advisory)

# General PR review at open/update time — same advisory layer as Astryx design-system review.
# Provider-agnostic (Anthropic or OpenAI); not anthropics/claude-code-action (swap models via secrets/vars).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run general advisory code review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
          ASTRYX_REVIEW_MODEL: ${{ vars.ASTRYX_REVIEW_MODEL }}
        run: node scripts/code-review-advisory.mjs
