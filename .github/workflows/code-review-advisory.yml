name: Code review (advisory)

# Portable general review — see scripts/code-review/ and docs/code-review-ci.md

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [dev]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      force:
        description: Re-run even if a review comment already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-advisory-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve PR SHAs (manual re-run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ github.event.inputs.pr_number }}"
          base=$(gh pr view "$pr" --json baseRefOid -q .baseRefOid)
          head=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"

      - name: Run general advisory code review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || env.PR_NUMBER }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_SHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
          CODE_REVIEW_PROJECT_LABEL: Bricola (Next.js)
          CODE_REVIEW_EXCLUDE_TOPICS: Astryx design-system usage, component choice, Tailwind design tokens, and AGENTS.md UI conventions (handled by the Astryx advisory workflow).
          FORCE_REVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == true && 'true' || '' }}
        run: node scripts/code-review/advisory.mjs
